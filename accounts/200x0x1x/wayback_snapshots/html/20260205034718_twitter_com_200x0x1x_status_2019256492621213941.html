  刑罚的目的在于唤醒受罚者身上的“良知谴责”，但是刑罚实际上所做的只是让罪犯变得更加冷血、狡诈和残忍，他们是最少受到罪疚感折磨的群体。受惩罚者不会在报复中看到自己的罪恶，而只是将这些伤害视为不幸，因此相比于反思他们做了什么，他们思考更多的是自己是如何做的、怎样做得更好以规避惩戒，因此刑罚增进的不是良知而是计谋，增进的是人全部的计谋、戏谑和诡计，律法暴力的惩戒从不使一个人在道德上变得更好。
