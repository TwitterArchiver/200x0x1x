  书写是一种进行铭刻的行为，就好像《在流放地》里刑罚机器在罪犯身体上铭刻律法那样，作者的身体就是一张签名。书写不是为着记录或者表达，相反，某物在书写中得到赋形，从潜能进入现实之域。可以说，写作就是一台刑罚机器：作者被要求把自己固定在机器内部，让书写在他的身上“刺绣”。
