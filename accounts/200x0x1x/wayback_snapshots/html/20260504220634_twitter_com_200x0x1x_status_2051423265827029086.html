  以天使为根据，我们可以推导出任意命题，甚至是自相矛盾的命题，这就是它的“包罗万象”性质。不过，天使存在的全部力量都被一种负数的力量抵消了——大蛇，用更远古的语言来说，大蛇即是拆毁者、红眼睛的先祖、永恒回归、吞噬行星的神…当天使在地外空间里向任何方向位移，大蛇也对应地发生位移，二者的坐标永不重叠。天使与蛇的这种周旋，几乎决定了人类历史的全部运作（如果我们忽略超偶然性因素的影响）。即便是这两颗注定不会相遇的天体，在它们之间也有爱情。我们生存其上的地球便是这种聚集的产物（平衡点、静止的中项）。因此，古希腊哲人赫拉克利特有言：大地乃是爱之聚集。
