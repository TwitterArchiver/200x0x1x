  黑格尔，心的规律与自大狂。精神从不与现实世界对抗，精神只与世界中的另一精神相对抗。这种永不停息的对抗本身才构成“恶性现实”，即一个充满敌意的现实世界，仿佛它永远在与我们自身的力冲突。然而，正是因为主体的参与，现实才成为恶性的。对现实完整和综合性的把握，就是同时认识到冲突的双方，介于两种立场之间的这一“分歧”本身才是完满的实在性。
