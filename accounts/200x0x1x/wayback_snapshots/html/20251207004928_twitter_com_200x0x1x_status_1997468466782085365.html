  “让我们的心灵尽情充斥着死亡...让我们随时随地任由自己的想象去描绘死亡的模样。在马儿失足倒地、屋瓦掉落、细得不能再细的针刺入体内时，让我们好好思忖：死亡本身到底是什么？”——蒙田后来曾经多次用“预演”（exercitation）一词描述他的濒死体验。在身体无意识的剧烈挣扎中，他感受到的是一种在死亡的潮水表面的愉悦漂浮，他的手仿佛在搔痒或是在拼命撕开自己的身体，而他却只是感觉到自己的灵魂正轻盈地系于唇尖，这些构成他内部的较轻的、属光的元素正随时准备升入高空。死亡就是游泳...他短暂地游到了死亡的边缘，尝了一口死亡的味道，这是一次“对死亡的练习”。
